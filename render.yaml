services:
  - type: web
    name: study-hall
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: quiz-arena
    runtime: node
    plan: free
    rootDir: quiz-arena
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: collaborative-kanban
    runtime: node
    plan: free
    rootDir: collaborative-kanban
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
